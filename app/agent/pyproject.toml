[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "AgentCore Runtime Application using LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore ~= 1.26.0",
    "deepagents[aws] ~= 0.7.38",
    "opentelemetry-instrumentation-langchain ~= 0.62.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
